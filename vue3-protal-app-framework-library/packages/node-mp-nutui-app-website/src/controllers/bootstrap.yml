application:
  # 应用程序名称
  name: 'node-mp-nutui-app-website'
  # 应用程序启动监听的端口
  port: ${port:9090}
  # 应用环境变量
  profiles:
     active: '${profiles:debug}'
# 注册中心配置
eureka:
  client:
    # eureka服务器地址
     serverUrls: '${eureka.servers:http://eureka.mcdev/eureka/}'
userSetting:
  logging: false
---
# 本地环境配置
application.profiles: debug
# application.profiles: local
# application:
#   env: 'local'
eureka:
  registerEureka: false
mctech:
   rpc:
     service:
      # key为服务的serviceId, value为对应的目标服务器的地址信息
      # 'iquantity-website': 'http://localhost:10001/iquantity/'
      # 'node-ma2-maccount-service': 'http://localhost:8192'
      # 'node-product-guide-service': 'http://localhost:8198'
# 认证配置
cas:
  client:
    # cas身份认证，认证中心登录页所在的站点，跳转到登录页的地址会在后面加上'/login'路径，客户端重定向
    casServerUrlPrefix: 'http://dev.mctech.vip/cas'
    # cas身份认证，客户端验证返回的ticket有效性的地址前缀，有可能是内网地址。服务端内部调用路径
    casValidateUrlPrefix: 'http://node-cas-site:8080/cas/'
    # 身份认证成功后带着ticket回跳的服务器地址前缀，浏览器要访问的目标地址前缀
    casServiceUrl: 'http://localhost:6003/'
    # 需要跳过身份验证的地址，','分隔，支持ant格式的路径
    ignorePathes: /assets/**,/js/**,/lib/**,/module/**,/static/**,/images/**
